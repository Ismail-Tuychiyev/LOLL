<script>
(() => {
  const bar   = document.getElementById('annBar');
  const track = document.getElementById('annTrack');
  const prev  = bar.querySelector('.ann-prev');
  const next  = bar.querySelector('.ann-next');
  const close = document.getElementById('annClose');
  if (!bar || !track) return;

  let i = 0;
  const items = Array.from(track.children);

 function shiftTo(n){
  i = (n + items.length) % items.length;
  const w = bar.querySelector('.ann-viewport').clientWidth; // oynaning kengligi
  track.style.transform = `translateX(${-i * w}px)`;
}


  // Auto-rotate
  let timer = setInterval(() => shiftTo(i+1), 4000);

  // Buttons
  next.addEventListener('click', () => { clearInterval(timer); shiftTo(i+1); });
  prev.addEventListener('click', () => { clearInterval(timer); shiftTo(i-1); });

  // Pause on hover (desktop)
  bar.addEventListener('mouseenter', () => clearInterval(timer));
  bar.addEventListener('mouseleave', () => timer = setInterval(() => shiftTo(i+1), 5000));

  // Close
  close?.addEventListener('click', () => {
    bar.remove();
    document.querySelector('.navbar')?.style.setProperty('top','0px');
  });

  // Touch swipe (mobil uchun qulay)
  let sx = 0, dx = 0;
  bar.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  bar.addEventListener('touchend',   e => {
    dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) {
      clearInterval(timer);
      shiftTo(i + (dx < 0 ? 1 : -1));
    }
  }, {passive:true});

  // Init & on resize
  window.addEventListener('load', () => shiftTo(0));
  window.addEventListener('resize', () => shiftTo(i));

  // Reduced motion: auto-rotate o‘chiriladi
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    clearInterval(timer);
  }
})();
</script>

<!-- RANDOM tartib helperlari (sessiya/daily deterministik) -->
<script>
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}
function strSeed(s){
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffleDet(arr, rand){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
// Sessiya bo‘yicha seed (xohlasang daily RNGga almashtiramiz)
function getSessionRng(){
  const key = 'prd_seed_v1';
  let seed = sessionStorage.getItem(key);
  if (!seed){
    const daily = new Date().toDateString();
    const rnd   = Math.random().toString(36).slice(2);
    seed = strSeed(daily + '|' + rnd).toString();
    sessionStorage.setItem(key, seed);
  }
  return mulberry32(parseInt(seed,10) || 1);
}
</script>

<script>
/* Minimal mahsulot ma’lumotlari */

/* Gridga render */
const grid = document.getElementById('prodGrid');
const fmt = n => n.toLocaleString('uz-UZ') + " so'm";

function cardHTML(p){
  return `
  <a class="prod-card" href="product.html?slug=${encodeURIComponent(p.slug)}" data-slug="${p.slug}">
    ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
    <div class="thumb">

      <img src="${p.images.hover}" alt="" class="img hover">
    </div>
    <h3 class="name">${p.title}</h3>
    <div class="price">${fmt(p.price)}</div>
    <div class="swatches">
      ${p.colors.map((c,i)=>`
        <button class="swatch" style="--sw:${c.hex}" aria-label="${c.name}" data-img="${c.image}" ${i===0?'aria-current="true"':''}></button>
      `).join('')}
    </div>
  </a>`;
}

function bannerHTML(b){
  return `
    <a class="inter-banner" href="${b.link}">
      <img src="${b.image}" alt="${b.title}" loading="lazy">
      <div class="inter-content">
        <div class="inter-title">${b.title}</div>
        <div class="inter-sub">${b.subtitle}</div>
        <span class="inter-btn">KO'RISH</span>
      </div>
    </a>
  `;
}

(function renderGridWithBanners(){
  // Asl ma’lumotni buzmaymiz — nusxa olamiz
  const src = Array.isArray(window.products) ? window.products : [];
  const banners = (window.banners || []).slice();

  // Debug uchun shuffle’ni o‘chirib ko‘rish: ?noshuffle=1
  const noShuffle = location.search.includes('noshuffle=1');

  // Deterministik shuffle (sessiya bo‘yicha)
  const items = noShuffle ? src.slice() : shuffleDet(src.slice(), getSessionRng());

  // Banner aylantirgich
  let bIndex = 0;
  const pickBanner = () => {
    if (!banners.length) return null;
    const b = banners[bIndex % banners.length];
    bIndex++;
    return b;
  };

  const out = [];
  for (let i = 0; i < items.length; i++) {
    out.push(cardHTML(items[i]));
    if ((i+1) % 8 === 0) {
      const b = pickBanner();
      if (b) out.push(bannerHTML(b));
    }
  }
  grid.innerHTML = out.join('');
})();




/* Rang swatch hover/clickda suratni almashtirish */

</script>






<script>
(function(){
  const btn   = document.getElementById('searchBtn');
  const root  = document.getElementById('searchOverlay');
  const input = document.getElementById('srchInput');
  const list  = document.getElementById('srchResults');
  const backdrop = root?.querySelector('.srch-backdrop');
  const closeEls = root?.querySelectorAll('[data-close]');

  function openDrawer(){
    if(!root) return;
    root.classList.add('is-open');
    setTimeout(()=> input?.focus(), 120);
    document.body.style.overflow = 'hidden';
    if (list) list.innerHTML = '<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>';
  }
  function closeDrawer(){
    root?.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  // Natija elementiga bosilganda panelni yopib yuboramiz
list?.addEventListener('click', (e)=>{
  const a = e.target.closest('.srch-item');
  if (!a) return;
  // scroll lockni ham yechamiz
  root.classList.remove('is-open');
  document.body.style.overflow = '';
});


  btn?.addEventListener('click', (e)=>{ e.preventDefault(); openDrawer(); });
  closeEls?.forEach(el => el.addEventListener('click', closeDrawer));
  backdrop?.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && root?.classList.contains('is-open')) closeDrawer();
  });
})();
</script>



<script>
// ====== SEARCH RANKER (eski qidiruv skriptini shu bilan almashtiramiz) ======
const LAT_MAP = {'қ':'q','ў':"o'",'ғ':"g'",'ҳ':'h','ё':'yo','ю':'yu','я':'ya','й':'y','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ь':'','э':'e','ы':'i'};
function normRaw(s=''){ s=(s||'').toString().toLowerCase().trim();
  s=s.replace(/[а-яёҳқғўйцчшщъьэы]/g,ch=>LAT_MAP[ch]??ch)
     .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
     .replace(/[ʻ’`]/g,"'").replace(/\s+/g,' ');
  return s;
}
const tokenize = s => normRaw(s).split(/[^a-z0-9']+/).filter(Boolean);

const SYN = {
  jins: ["jeans","denim","jinsy"],
  koylak: ["shirt","t-shirt","tee","futbolka"],
  kurtka: ["jacket","coat","anorak","windbreaker"],
  shim: ["pants","trousers","chinos","joggers"],
  krasovka: ["sneaker","trainer","krossovka","keds"],
  tapichka: ["slipper","slide","sandal"]
};

function lev(a,b){ a=normRaw(a); b=normRaw(b);
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 3;
  const dp=Array(n+1).fill(0); for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){ let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){ const t=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=t;
    }}
  return dp[n];
}

function scoreProduct(p, q){
  const title=normRaw(p.title||''), slug=normRaw(p.slug||'');
  const tags=(p.tags||[]).map(normRaw);
  const badge=(p.badge||'').toLowerCase();
  const qn=normRaw(q), qTokens=tokenize(q);
  const synTokens=qTokens.flatMap(t=>SYN[t]?SYN[t]:[]);
  let s=0;

  if(title.includes(qn)) s+=40;
  if(slug.includes(qn))  s+=28;

  for(const t of qTokens){
    if(title.startsWith(t)||title.split(' ').some(w=>w.startsWith(t))) s+=16;
    if(title.includes(t)) s+=12;
    if(slug.includes(t))  s+=10;
    if(tags.some(tag=>tag.includes(t))) s+=8;

    const words=title.split(/\s+/);
    const near1=words.some(w=>lev(w,t)<=1);
    const near2=!near1 && words.some(w=>lev(w,t)===2);
    if(near1) s+=9; else if(near2) s+=4;
  }
  for(const syn of synTokens)
    if(title.includes(syn)||slug.includes(syn)||tags.some(t=>t.includes(syn))) s+=8;

  if(Array.isArray(p.colors)){
    const colorStr=p.colors.map(c=>normRaw(c.name||'')).join(' ');
    for(const t of qTokens) if(colorStr.includes(t)) s+=5;
  }
  if(badge.includes('new')) s+=4;
  if(p.compare_at_price && p.price && p.price<p.compare_at_price) s+=6;
  if(typeof p.popularity==='number') s+=Math.min(10,p.popularity);
  return s;
}

(function(){
  const input=document.getElementById('srchInput');
  const list =document.getElementById('srchResults');
  const items=Array.isArray(window.products)?window.products:[];
  const fmt  =n=>(n||0).toLocaleString('uz-UZ')+" so‘m";

  const itemHTML=p=>{
    const sale=p.compare_at_price && p.price<p.compare_at_price;
    return `<a class="srch-item" href="product.html?slug=${encodeURIComponent(p.slug)}" onclick="document.body.style.overflow=''">
      <div class="srch-thumb"><img src="${p.images?.main||''}" alt="${p.title}"></div>
      <div class="srch-meta">
        <div class="srch-name">${p.title}</div>
        ${sale?`<div class="srch-price"><s>${fmt(p.compare_at_price)}</s> <span style="color:#d00">${fmt(p.price)}</span></div>`:`<div class="srch-price">${fmt(p.price)}</div>`}
      </div>
    </a>`;
  };

  function renderSmart(q){
    const qn=normRaw(q);
    if(!qn){ list.innerHTML='<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>'; return; }
    const ranked=items.map(p=>({p,s:scoreProduct(p,qn)})).filter(x=>x.s>0)
                       .sort((a,b)=>b.s-a.s).slice(0,30).map(x=>x.p);
    list.innerHTML= ranked.length? ranked.map(itemHTML).join('')
      : '<div class="muted" style="padding:18px 4px; text-align:center; font-weight:700;">Hech narsa topilmadi.</div>';
  }

  let t=0;
  input?.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>renderSmart(input.value),120); });
  document.querySelector('.srch-clear')?.addEventListener('click', ()=>{
    input.value=''; list.innerHTML='<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>'; input.focus();
  });

 
  
})();
</script>


<script>
(function () {
  const splash   = document.getElementById('splash');
  if (!splash) return;

  // Navigation turi: reload/back-forward bo‘lsa splash kerak emas
  const nav = performance.getEntriesByType('navigation')[0];
  const isReload      = nav?.type === 'reload';
  const isBackForward = nav?.type === 'back_forward';

  // Referrer tekshiruvi: tashqi domenmi?
  let showBecauseExternal = false;
  try {
    if (document.referrer) {
      const refOrigin = new URL(document.referrer).origin;
      showBecauseExternal = refOrigin !== location.origin;
    }
  } catch (e) { /* xotirjam, fallback ishlaydi */ }

  // Adrestdan to‘g‘ri kirish (referrer yo‘q): shu TAB sessiyasida 1 marta ko‘rsatamiz
  const directKey = 'chinova_direct_splash_shown';
  const isDirectFirstTime = !document.referrer && !sessionStorage.getItem(directKey);

  // Yakuniy qaror
  const shouldShow =
    !isReload && !isBackForward && (showBecauseExternal || isDirectFirstTime);

  if (!shouldShow) {
    // Ko‘rsatmaymiz: darrov olib tashlaymiz (FOUC bo‘lmasin)
    splash.remove();
    return;
  }

  if (isDirectFirstTime) {
    sessionStorage.setItem(directKey, '1');
  }

  // Splash 4s => so‘nadi => DOMdan olib tashlaymiz
  const SPLASH_DURATION = 0; // ms
  window.addEventListener('load', () => {
    setTimeout(() => {
      splash.classList.add('is-hide');
      setTimeout(() => splash.remove(), 700); // CSS transition bilan mos
    }, SPLASH_DURATION);
  });
})();
</script>
