<script>
(() => {
  const bar   = document.getElementById('annBar');
  const track = document.getElementById('annTrack');
  const prev  = bar.querySelector('.ann-prev');
  const next  = bar.querySelector('.ann-next');
  const close = document.getElementById('annClose');
  if (!bar || !track) return;

  let i = 0;
  const items = Array.from(track.children);

 function shiftTo(n){
  i = (n + items.length) % items.length;
  const w = bar.querySelector('.ann-viewport').clientWidth; // oynaning kengligi
  track.style.transform = `translateX(${-i * w}px)`;
}


  // Auto-rotate
  let timer = setInterval(() => shiftTo(i+1), 4000);

  // Buttons
  next.addEventListener('click', () => { clearInterval(timer); shiftTo(i+1); });
  prev.addEventListener('click', () => { clearInterval(timer); shiftTo(i-1); });

  // Pause on hover (desktop)
  bar.addEventListener('mouseenter', () => clearInterval(timer));
  bar.addEventListener('mouseleave', () => timer = setInterval(() => shiftTo(i+1), 5000));

  // Close
  close?.addEventListener('click', () => {
    bar.remove();
    document.querySelector('.navbar')?.style.setProperty('top','0px');
  });

  // Touch swipe (mobil uchun qulay)
  let sx = 0, dx = 0;
  bar.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  bar.addEventListener('touchend',   e => {
    dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) {
      clearInterval(timer);
      shiftTo(i + (dx < 0 ? 1 : -1));
    }
  }, {passive:true});

  // Init & on resize
  window.addEventListener('load', () => shiftTo(0));
  window.addEventListener('resize', () => shiftTo(i));

  // Reduced motion: auto-rotate o‘chiriladi
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    clearInterval(timer);
  }
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const fmt = n => n.toLocaleString('uz-UZ') + " so‘m";

  // URL -> slug
  const params    = new URLSearchParams(location.search);
  const slugParam = (params.get('slug') || '').trim();
  const norm = s => (s||'').toString().trim().toLowerCase().replace(/\s+/g,'-');

  // Ma'lumot
  const list = (typeof products !== 'undefined' && Array.isArray(products)) ? products : [];
  const p = list.find(x => norm(x.slug) === norm(slugParam) || norm(x.title) === norm(slugParam));

  // DOM
  const titleEl   = document.getElementById('pTitle');
  const priceEl   = document.getElementById('pPrice');
  const mainImg   = document.getElementById('pMain');
  const thumbsEl  = document.getElementById('pThumbs');
  const colorsEl  = document.getElementById('pColors');
  const badgeEl   = document.getElementById('pBadge');
  const bulletsEl = document.getElementById('pBullets');
  const stockEl   = document.getElementById('pStock');
  const sizeRow   = document.getElementById('sizeRow');
  const sizesEl   = document.getElementById('pSizes');
  const buyBtn    = document.getElementById('buyBtn');

  // p topilmasa
  if (!p) {
    document.querySelector('.product__grid').innerHTML =
      '<p style="padding:24px;font-size:18px">Mahsulot topilmadi.</p>';
    console.log('slug=', slugParam, 'available=', list.map(v=>v.slug));
    return;
  }

  // Asosiy ma'lumotlar
  document.title        = p.title + ' — CHINOVA';
  titleEl.textContent   = p.title;
  priceEl.textContent   = fmt(p.price);
  mainImg.src           = p.images.main;
  badgeEl.textContent   = p.badge || '';
  badgeEl.style.display = p.badge ? 'inline-block' : 'none';

  // Afzalliklar
  const feats = Array.isArray(p.bullets) ? p.bullets : (Array.isArray(p.features) ? p.features : []);
  if (feats.length) {
    bulletsEl.innerHTML = feats.map(t => `<li>${t}</li>`).join('');
  } else {
    bulletsEl.style.display = 'none';
  }

  // Thumbs
  const thumbs = [p.images.main, p.images.hover].filter(Boolean);
  thumbsEl.innerHTML = thumbs.map((src, i) =>
    `<img class="${i===0?'is-active':''}" src="${src}" data-large="${src}" alt="">`
  ).join('');
  const thumbImgs = thumbsEl.querySelectorAll('img');
  thumbImgs.forEach(t => {
    t.addEventListener('click', () => {
      thumbImgs.forEach(x => x.classList.remove('is-active'));
      t.classList.add('is-active');
      mainImg.src = t.dataset.large || t.src;
    });
  });

  // Ranglar
  colorsEl.innerHTML = (p.colors || []).map((c,i)=>`
    <button class="swatch ${i===0?'is-active':''}" style="--c:${c.hex}" aria-label="${c.name}" data-img="${c.image}"></button>
  `).join('');
  const colorBtns = colorsEl.querySelectorAll('.swatch');
  colorBtns.forEach(b=>{
    b.addEventListener('click', ()=>{
      colorBtns.forEach(x=>x.classList.remove('is-active'));
      b.classList.add('is-active');
      const img = b.getAttribute('data-img');
      if (img) mainImg.src = img;
    });
  });

  // O‘lchamlar
  if (Array.isArray(p.sizes) && p.sizes.length) {
    sizesEl.innerHTML = p.sizes.map((s, i) =>
      `<button class="size ${i===0?'is-active':''}" data-size="${s}">${s}</button>`
    ).join('');
    const sizeBtns = sizesEl.querySelectorAll('.size');
    sizeBtns.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        sizeBtns.forEach(x=>x.classList.remove('is-active'));
        btn.classList.add('is-active');
        updatePrice();   
      });
    });
  } else {
    sizeRow.style.display = 'none';
  }

  function getSelectedSize(){
  return document.querySelector('#pSizes .size.is-active')?.textContent.trim() || '';
}
function priceFor(size){
  return (p.sizePrices && p.sizePrices[size]) || p.price;
}
function updatePrice(){
  const s = getSelectedSize();
  priceEl.textContent = fmt(priceFor(s));
}


  // STOCK
  const stock = Number(p.stock ?? 0);
  function stockText(n){
    if (n <= 0) return "Qolmadi";
    if (n <= 2) return `Yakunlanmoqda — ${n} ta qoldi`;
    if (n <= 5) return `${n} ta qoldi`;
    return "Omborda bor";
  }
  function stockClass(n){
    if (n <= 0) return "stock--out";
    if (n <= 2) return "stock--low";
    if (n <= 5) return "stock--mid";
    return "stock--ok";
  }
  stockEl.textContent = stockText(stock);
  stockEl.className   = "stock-note " + stockClass(stock);

  if (stock <= 0) {
    buyBtn.classList.add('is-disabled');
    buyBtn.setAttribute('disabled', 'disabled');
    buyBtn.textContent = "HOZIRCHA YO‘Q";
  }

  // HARID QILISH
  function getSelectedColorName(){
    return document.querySelector('#pColors .swatch.is-active')?.getAttribute('aria-label') || '';
  }
  function getSelectedSize(){
    return document.querySelector('#pSizes .size.is-active')?.textContent.trim() || '';
  }

   document.getElementById('buyBtn')?.addEventListener('click', () => {
  const size = getSelectedSize();
  addToCart({
    id:    p.code || p.slug,
    slug:  p.slug,
    title: p.title,
    price: Number(priceFor(size)),    // <-- YANGI
    color: getSelectedColorName(),
    size:  size,
    image: p.images?.main || '',
    qty:   1
  });
  location.href = 'checkout.html';


  });
});
</script>

<script>
// ====== SEARCH RANKER (eski qidiruv skriptini shu bilan almashtiramiz) ======
const LAT_MAP = {'қ':'q','ў':"o'",'ғ':"g'",'ҳ':'h','ё':'yo','ю':'yu','я':'ya','й':'y','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ь':'','э':'e','ы':'i'};
function normRaw(s=''){ s=(s||'').toString().toLowerCase().trim();
  s=s.replace(/[а-яёҳқғўйцчшщъьэы]/g,ch=>LAT_MAP[ch]??ch)
     .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
     .replace(/[ʻ’`]/g,"'").replace(/\s+/g,' ');
  return s;
}
const tokenize = s => normRaw(s).split(/[^a-z0-9']+/).filter(Boolean);

const SYN = {
  jins: ["jeans","denim","jinsy"],
  koylak: ["shirt","t-shirt","tee","futbolka"],
  kurtka: ["jacket","coat","anorak","windbreaker"],
  shim: ["pants","trousers","chinos","joggers"],
  krasovka: ["sneaker","trainer","krossovka","keds"],
  tapichka: ["slipper","slide","sandal"]
};

function lev(a,b){ a=normRaw(a); b=normRaw(b);
  const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 3;
  const dp=Array(n+1).fill(0); for(let j=0;j<=n;j++) dp[j]=j;
  for(let i=1;i<=m;i++){ let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){ const t=dp[j];
      dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=t;
    }}
  return dp[n];
}

function scoreProduct(p, q){
  const title=normRaw(p.title||''), slug=normRaw(p.slug||'');
  const tags=(p.tags||[]).map(normRaw);
  const badge=(p.badge||'').toLowerCase();
  const qn=normRaw(q), qTokens=tokenize(q);
  const synTokens=qTokens.flatMap(t=>SYN[t]?SYN[t]:[]);
  let s=0;

  if(title.includes(qn)) s+=40;
  if(slug.includes(qn))  s+=28;

  for(const t of qTokens){
    if(title.startsWith(t)||title.split(' ').some(w=>w.startsWith(t))) s+=16;
    if(title.includes(t)) s+=12;
    if(slug.includes(t))  s+=10;
    if(tags.some(tag=>tag.includes(t))) s+=8;

    const words=title.split(/\s+/);
    const near1=words.some(w=>lev(w,t)<=1);
    const near2=!near1 && words.some(w=>lev(w,t)===2);
    if(near1) s+=9; else if(near2) s+=4;
  }
  for(const syn of synTokens)
    if(title.includes(syn)||slug.includes(syn)||tags.some(t=>t.includes(syn))) s+=8;

  if(Array.isArray(p.colors)){
    const colorStr=p.colors.map(c=>normRaw(c.name||'')).join(' ');
    for(const t of qTokens) if(colorStr.includes(t)) s+=5;
  }
  if(badge.includes('new')) s+=4;
  if(p.compare_at_price && p.price && p.price<p.compare_at_price) s+=6;
  if(typeof p.popularity==='number') s+=Math.min(10,p.popularity);
  return s;
}

(function(){
  const input=document.getElementById('srchInput');
  const list =document.getElementById('srchResults');
  const items=Array.isArray(window.products)?window.products:[];
  const fmt  =n=>(n||0).toLocaleString('uz-UZ')+" so‘m";

  const itemHTML=p=>{
    const sale=p.compare_at_price && p.price<p.compare_at_price;
    return `<a class="srch-item" href="product.html?slug=${encodeURIComponent(p.slug)}" onclick="document.body.style.overflow=''">
      <div class="srch-thumb"><img src="${p.images?.main||''}" alt="${p.title}"></div>
      <div class="srch-meta">
        <div class="srch-name">${p.title}</div>
        ${sale?`<div class="srch-price"><s>${fmt(p.compare_at_price)}</s> <span style="color:#d00">${fmt(p.price)}</span></div>`:`<div class="srch-price">${fmt(p.price)}</div>`}
      </div>
    </a>`;
  };

  function renderSmart(q){
    const qn=normRaw(q);
    if(!qn){ list.innerHTML='<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>'; return; }
    const ranked=items.map(p=>({p,s:scoreProduct(p,qn)})).filter(x=>x.s>0)
                       .sort((a,b)=>b.s-a.s).slice(0,30).map(x=>x.p);
    list.innerHTML= ranked.length? ranked.map(itemHTML).join('')
      : '<div class="muted" style="padding:18px 4px; text-align:center; font-weight:700;">Hech narsa topilmadi.</div>';
  }

  let t=0;
  input?.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>renderSmart(input.value),120); });
  document.querySelector('.srch-clear')?.addEventListener('click', ()=>{
    input.value=''; list.innerHTML='<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>'; input.focus();
  });

 
  
})();
</script>
<script>
(function(){
  const btn   = document.getElementById('searchBtn');
  const root  = document.getElementById('searchOverlay');
  const input = document.getElementById('srchInput');

  function openDrawer(){
    if(!root) return;
    root.classList.add('is-open');
    setTimeout(()=> input?.focus(), 120);
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(){
    root.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  btn?.addEventListener('click', e=>{ e.preventDefault(); openDrawer(); });
  root?.addEventListener('click', e=>{
    if (e.target.closest('[data-close]') || e.target === root.querySelector('.srch-backdrop')) closeDrawer();
  });
  document.addEventListener('keydown', e=>{
    if (e.key === 'Escape' && root?.classList.contains('is-open')) closeDrawer();
  });
})();
</script>
