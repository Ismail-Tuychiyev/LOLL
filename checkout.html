<script>
(() => {
  const bar   = document.getElementById('annBar');
  const track = document.getElementById('annTrack');
  const prev  = bar.querySelector('.ann-prev');
  const next  = bar.querySelector('.ann-next');
  const close = document.getElementById('annClose');
  if (!bar || !track) return;

  let i = 0;
  const items = Array.from(track.children);

 function shiftTo(n){
  i = (n + items.length) % items.length;
  const w = bar.querySelector('.ann-viewport').clientWidth; // oynaning kengligi
  track.style.transform = `translateX(${-i * w}px)`;
}


  // Auto-rotate
  let timer = setInterval(() => shiftTo(i+1), 4000);

  // Buttons
  next.addEventListener('click', () => { clearInterval(timer); shiftTo(i+1); });
  prev.addEventListener('click', () => { clearInterval(timer); shiftTo(i-1); });

  // Pause on hover (desktop)
  bar.addEventListener('mouseenter', () => clearInterval(timer));
  bar.addEventListener('mouseleave', () => timer = setInterval(() => shiftTo(i+1), 5000));

  // Close
  close.addEventListener('click', () => {
    bar.remove();
    document.querySelector('.navbar')?.style.setProperty('top','0px');
  });

  // Touch swipe (mobil uchun qulay)
  let sx = 0, dx = 0;
  bar.addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
  bar.addEventListener('touchend',   e => {
    dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 40) {
      clearInterval(timer);
      shiftTo(i + (dx < 0 ? 1 : -1));
    }
  }, {passive:true});

  // Init & on resize
  window.addEventListener('load', () => shiftTo(0));
  window.addEventListener('resize', () => shiftTo(i));

  // Reduced motion: auto-rotate o‘chiriladi
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    clearInterval(timer);
  }
})();
</script>




<script>
// --- Telegram sozlamalari (o'zingniki turaversin)
const TG = {
  token: '8168640984:AAFh5LdWM4ki-U87tK1KGsOe6KI-FCl5nJk',
  chat_id: '6623050833'
};
const TG_API = `https://api.telegram.org/bot${TG.token}`;
const fmt = n => (Number(n)||0).toLocaleString('uz-UZ') + " so‘m";
const shippingCost = subtotal => subtotal >= 150000 ? 0 : 15000;

async function tgSendMessage(text){
  if(!TG.token || !TG.chat_id) return;
  try{
    await fetch(`${TG_API}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG.chat_id, text, parse_mode:'HTML'})
    });
  }catch(e){ console.warn('sendMessage error', e); }
}
async function tgSendPhoto(photoUrl, caption){
  if(!TG.token || !TG.chat_id) return;
  try{
    await fetch(`${TG_API}/sendPhoto`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:TG.chat_id, photo:photoUrl, caption, parse_mode:'HTML'})
    });
  }catch(e){ console.warn('sendPhoto error', e); }
}

// --- CHECKOUT: SAVATGA ASOSLANGAN KO'RINISH ---
document.addEventListener('DOMContentLoaded', ()=>{
  const listEl   = document.getElementById('sumItem');     // o'ng blok – itemlar
  const sumPrice = document.getElementById('sumPrice');    // subtotal / shipping
  const sumTotal = document.getElementById('sumTotal');    // jami

  function render(){
    const cart = getCart(); // cart.js dan
    if(!cart.length){
      listEl.innerHTML = `<p>Savat hozircha bo‘sh.</p>`;
      sumPrice.innerHTML = `
        <div class="row"><span>Mahsulotlar</span><b>0 so‘m</b></div>
        <div class="row"><span>Yetkazib berish</span><b>${fmt(15000)}</b></div>`;
      sumTotal.textContent = fmt(15000);
      return;
    }

    listEl.innerHTML = cart.map(it=>`
      <div class="order-item" data-key="${it.key}">
        <img class="sum-img" src="${it.image||''}" alt="">
        <div class="sum-meta">
          <div style="font-weight:700">${it.title}</div>
          <div class="muted">Rang: ${it.color||'—'} • O‘lcham: ${it.size||'—'}</div>
          <div class="qty" style="margin-top:8px">
            <button class="qty-btn" data-act="dec">−</button>
            <input class="qty-num" value="${it.qty}" readonly>
            <button class="qty-btn" data-act="inc">+</button>
          </div>
        </div>
        <div class="price-col">
          <div class="unit">${fmt(it.price)}</div>
          <button class="item-remove" title="O‘chirish" data-act="remove">🗑️</button>
        </div>
      </div>
    `).join('');

    const subtotal = cart.reduce((s,i)=> s + (i.price||0)*(i.qty||0), 0);
    const ship = shippingCost(subtotal);

    sumPrice.innerHTML = `
      <div class="row"><span>Mahsulotlar</span><b>${fmt(subtotal)}</b></div>
      <div class="row"><span>Yetkazib berish</span><b>${ship?fmt(ship):'BEPUL'}</b></div>
    `;
    sumTotal.textContent = fmt(subtotal + ship);
  }

  // qty +/- va remove
  listEl.addEventListener('click', e=>{
    const act = e.target.dataset.act;
    if(!act) return;
    const item = e.target.closest('.order-item');
    const key  = item?.dataset.key;
    if(!key) return;

    if(act==='inc')    changeQty(key, +1);
    if(act==='dec')    changeQty(key, -1);
    if(act==='remove') removeFromCart(key);

    render();
  });

  // Form submit: kartadagi hamma mahsulotni Telegramga yuborish
  document.getElementById('orderForm')?.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);

  const buyer = {
    name:   (fd.get('name')||'').trim(),
    phone:  (fd.get('phone')||'').trim(),
    region: (fd.get('region')||'').trim(),
    address:(fd.get('address')||'').trim(),
    pay:    (fd.get('pay')||'').trim(),
    ship:   (fd.get('ship')||'').trim(),
    note:   (fd.get('note')||'').trim()
  };
  if(!buyer.name || !buyer.phone || !buyer.address){
    alert('Iltimos, ism / telefon / manzilni to‘ldiring.');
    return;
  }

  const cart = getCart();
  if(!cart.length){ alert('Savat bo‘sh.'); return; }

  // 1) HAR BIR ITEM: rasm HTTP(S) bo'lsa sendPhoto, bo'lmasa sendMessage
  for (const it of cart){
    const cap =
      `<b>${it.title}</b>\n`+
      `Kod: <code>${it.id||it.slug||'—'}</code>\n`+
      `Rang: ${it.color||'—'}\n`+
      `O‘lcham: ${it.size||'—'}\n`+
      `Narx: ${fmt(it.price)}\n`+
      `Soni: ${it.qty}\n`+
      `Jami: ${fmt((it.price||0)*(it.qty||0))}`;

    const isHttpImage = typeof it.image==='string' && /^https?:\/\//i.test(it.image);
    if (isHttpImage) {
      await tgSendPhoto(it.image, cap);
    } else {
      await tgSendMessage(cap); // lokal rasm bo‘lsa, matn yuboramiz
    }
  }

  // 2) Umumiy xulosa
  const subtotal = cart.reduce((s,i)=> s + (i.price||0)*(i.qty||0), 0);
  const ship     = shippingCost(subtotal);
  const total    = subtotal + ship;

  // (ixtiyoriy) itemlar ro'yxatini ham qo'shib yuborish
  const itemsText = cart.map((it,idx)=>
    `${idx+1}) ${it.title} • ${it.color||'—'} • ${it.size||'—'} x${it.qty} = ${fmt((it.price||0)*(it.qty||0))} [kod: ${it.id||it.slug||'—'}]`
  ).join('\n');

  const summary =
    `🧾 <b>Buyurtma xulosasi</b>\n\n`+
    (itemsText ? `${itemsText}\n\n` : '')+
    `👤 <b>Mijoz:</b> ${buyer.name}\n`+
    `📞 <b>Telefon:</b> ${buyer.phone}\n`+
    `📍 <b>Hudud:</b> ${buyer.region}\n`+
    `🏠 <b>Manzil:</b> ${buyer.address}\n`+
    `💳 <b>To‘lov:</b> ${buyer.pay==='card'?'Karta':'Naqd'}\n`+
    `🚚 <b>Yetkazish:</b> ${buyer.ship}\n`+
    (buyer.note?`📝 <b>Izoh:</b> ${buyer.note}\n`:'')+
    `\n— — — — —\n`+
    `Mahsulotlar: ${fmt(subtotal)}\n`+
    `Yetkazib berish: ${ship?fmt(ship):'BEPUL'}\n`+
    `✅ <b>Jami:</b> ${fmt(total)}`;

  await tgSendMessage(summary);

  alert('Rahmat! Buyurtmangiz qabul qilindi.');
  clearCart();
  location.href = 'index.html';
});


  // birinchi chizish
  render();
});
</script>
