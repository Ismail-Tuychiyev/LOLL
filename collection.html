  <!-- RANDOM tartib helperlari (sessiya/daily deterministik) -->
<script>
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}
function strSeed(s){
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shuffleDet(arr, rand){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function getSessionRng(){
  const key = 'prd_seed_v1';
  let seed = sessionStorage.getItem(key);
  if (!seed){
    const daily = new Date().toDateString();
    const rnd   = Math.random().toString(36).slice(2);
    seed = strSeed(daily + '|' + rnd).toString();
    sessionStorage.setItem(key, seed);
  }
  return mulberry32(parseInt(seed,10) || 1);
}
</script>


  <!-- Ann-bar slider (index dagidagi bilan aynan bir xil) -->
  <script>
  (() => {
    const bar   = document.getElementById('annBar');
    const track = document.getElementById('annTrack');
    const prev  = bar?.querySelector('.ann-prev');
    const next  = bar?.querySelector('.ann-next');
    if (!bar || !track) return;

    let i = 0;
    const items = Array.from(track.children);

    function shiftTo(n){
      i = (n + items.length) % items.length;
      const w = bar.querySelector('.ann-viewport').clientWidth;
      track.style.transform = `translateX(${-i * w}px)`;
    }
    let timer = setInterval(() => shiftTo(i+1), 4000);
    next?.addEventListener('click', () => { clearInterval(timer); shiftTo(i+1); });
    prev?.addEventListener('click', () => { clearInterval(timer); shiftTo(i-1); });
    bar.addEventListener('mouseenter', () => clearInterval(timer));
    bar.addEventListener('mouseleave', () => timer = setInterval(() => shiftTo(i+1), 5000));
    window.addEventListener('load', () => shiftTo(0));
    window.addEventListener('resize', () => shiftTo(i));
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ clearInterval(timer); }
  })();
  </script>

  <!-- Search drawer ochish/yopish (index dagidek yengil versiya) -->
  <script>
  (function(){
    const btn   = document.getElementById('searchBtn');
    const root  = document.getElementById('searchOverlay');
    const input = document.getElementById('srchInput');
    const list  = document.getElementById('srchResults');
    const backdrop = root?.querySelector('.srch-backdrop');
    const closeEls = root?.querySelectorAll('[data-close]');

    function openDrawer(){
      if(!root) return;
      root.classList.add('is-open');
      setTimeout(()=> input?.focus(), 120);
      document.body.style.overflow = 'hidden';
      if (list) list.innerHTML = '<div class="muted" style="padding:8px 2px">Qidirish uchun yozing…</div>';
    }
    function closeDrawer(){
      root?.classList.remove('is-open');
      document.body.style.overflow = '';
    }
    list?.addEventListener('click', (e)=>{
      const a = e.target.closest('.srch-item');
      if (!a) return;
      root.classList.remove('is-open');
      document.body.style.overflow = '';
    });
    btn?.addEventListener('click', (e)=>{ e.preventDefault(); openDrawer(); });
    closeEls?.forEach(el => el.addEventListener('click', closeDrawer));
    backdrop?.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && root?.classList.contains('is-open')) closeDrawer();
    });
  })();
  </script>

  <!-- Kolleksiya: filter + grid render -->
  <script>
  const params = new URLSearchParams(location.search);
  const cat = params.get('cat');

  const colMap = { kids:"Bolalar uchun", kitchen:"Uy & Oshxona", home:"Uy bezaklari", women:"Ayollar", men:"Erkaklar" };
  document.getElementById('colTitle').textContent = colMap[cat] || "Kolleksiya";

  // Avval filter
  const filtered = (window.products || []).filter(p => {
    const t = (p.tags || []).map(x => String(x).toLowerCase());
    if (!cat) return true;
    return t.includes(cat.toLowerCase());
  });

  // Keyin deterministik shuffle
  const items = shuffleDet(filtered.slice(), getSessionRng());

  const grid = document.getElementById('colGrid');
  const fmt = n => (n||0).toLocaleString('uz-UZ') + " so'm";
  function cardHTML(p){
    return `
      <a class="prod-card" href="product.html?slug=${encodeURIComponent(p.slug)}">
        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
        <div class="thumb">
          <img src="${p.images.main}" alt="${p.title}" class="img main">
          <img src="${p.images.hover}" alt="" class="img hover">
        </div>
        <h3 class="name">${p.title}</h3>
        <div class="price">${fmt(p.price)}</div>
        ${Array.isArray(p.colors) ? `
          <div class="swatches">
            ${p.colors.map((c,i)=>`
              <button class="swatch" style="--sw:${c.hex}" aria-label="${c.name}" ${i===0?'aria-current="true"':''}></button>
            `).join('')}
          </div>` : ``}
      </a>
    `;
  }

  grid.innerHTML = items.length
    ? items.map(cardHTML).join('')
    : '<div class="muted" style="padding:24px;text-align:center;">Bu bo‘limda mahsulot yo‘q</div>';
</script>
